<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DreamIn Lab</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: #1a1a1a;
    background: #ffffff;
    line-height: 1.7;
    margin: 0;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 680px; margin: 0 auto; padding: 64px 20px 96px; }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 12px; }
  .lead { font-size: 16px; color: #4a4a4a; margin: 0 0 48px; }
  h2 { font-size: 14px; font-weight: 700; color: #8a8a8a; margin: 0 0 16px; }
  ul.apps { list-style: none; padding: 0; margin: 0; }
  ul.apps li { margin: 0 0 14px; }
  ul.apps a { color: #1a1a1a; text-decoration: none; font-size: 17px; font-weight: 600; }
  ul.apps a:hover { text-decoration: underline; }
  ul.apps span { display: block; font-size: 14px; color: #8a8a8a; font-weight: 400; margin-top: 2px; }
  footer { margin-top: 72px; font-size: 13px; color: #b0b0b0; }
</style>
</head>
<body>
<main>
  <h1>DreamIn Lab</h1>
  <p class="lead">작은 아이디어를 앱으로 만드는 1인 개발 스튜디오입니다.</p>

  <h2>앱</h2>
  <ul class="apps">
    <li>
      <a href="/bom/">식물봄</a>
      <span>사진 한 장으로 식물을 알아보고 기록하는 앱</span>
    </li>
  </ul>

  <footer>DreamIn Lab</footer>
</main>
</body>
</html>
