<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>식물봄으로 돌아가는 중</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: #1a1a1a;
    background: #ffffff;
    line-height: 1.75;
    margin: 0;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 680px; margin: 0 auto; padding: 96px 20px; text-align: center; }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 12px; }
  p { margin: 0 0 12px; font-size: 16px; }
  .btn {
    display: inline-block;
    margin-top: 20px;
    padding: 14px 28px;
    border-radius: 10px;
    background: #3B6D11;
    color: #ffffff;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
  }
  .hint { margin-top: 28px; font-size: 14px; color: #8a8a8a; }
</style>
</head>
<body>
<main>
  <h1>식물봄으로 돌아가는 중이에요</h1>
  <p>잠시만 기다려 주세요.</p>
  <p><a class="btn" id="go" href="sikmulbom://auth-callback">앱으로 돌아가기</a></p>
  <p class="hint">화면이 그대로면 위 버튼을 눌러 주세요.</p>
</main>
<script>
  // 로그인 결과는 주소의 쿼리(?code=…) 또는 프래그먼트(#access_token=…)에 실려 온다.
  // 둘 다 그대로 보존해 앱으로 넘긴다 — 하나라도 빠지면 앱이 결과를 읽지 못한다.
  var target = 'sikmulbom://auth-callback' + window.location.search + window.location.hash;
  document.getElementById('go').setAttribute('href', target);
  // 자동 전달. 히스토리에 이 페이지를 남기지 않아 뒤로가기가 여기로 되돌아오지 않는다.
  window.location.replace(target);
</script>
</body>
</html>
